<main class="layout">
  <section>
    <h2>Crear Nuevo Usuario</h2>

    <article>
      <h3>Formulario de Registro de Usuario</h3>

      <p>
        Complete el formulario para crear una nueva cuenta de usuario del sistema.
        Todos los campos son obligatorios.
      </p>

      @if (mensajeExito(); as mensaje) {
        <p class="mensaje-exito" role="status">{{ mensaje }}</p>
      }
      @if (mensajeError(); as mensaje) {
        <p class="mensaje-error" role="alert">{{ mensaje }}</p>
      }

      <form [formGroup]="formulario" (ngSubmit)="crear()" novalidate>
        <fieldset class="form-grid">
          <legend>Datos del Usuario</legend>

          <p>
            <label for="nombreCompleto">Nombre completo</label>
            <input type="text" id="nombreCompleto" formControlName="nombreCompleto" required>
          </p>

          <p>
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" formControlName="correo" required>
          </p>

          <p>
            <label for="password">Contraseña</label>
            <input type="password" id="password" formControlName="password" required autocomplete="new-password">
          </p>

          <p>
            <label for="rol">Rol</label>
            <select id="rol" formControlName="rol_id" required>
              <option [ngValue]="null">-- Seleccione un rol --</option>
              @for (rol of roles; track rol.id) {
                <option [ngValue]="rol.id">{{ rol.nombre }}</option>
              }
            </select>
          </p>
        </fieldset>

        <p class="form-acciones">
          <button type="submit" class="btn-primario" [disabled]="enviando()">
            {{ enviando() ? 'Creando…' : 'Crear usuario' }}
          </button>
          <button type="button" class="btn-secundario" (click)="limpiarFormulario()">Limpiar formulario</button>
        </p>
      </form>
    </article>
  </section>
</main>
